name: Dependabot auto-merge

# Enables auto-merge on Dependabot's patch and minor bumps. Majors still wait
# for a human — plancheck pins defn, whose majors can move the embedded Dolt.
#
# This only does anything useful while `test` is a required status check on
# main. With no required check, `gh pr merge --auto` merges on the spot instead
# of waiting for CI. See scripts/require-ci-check.sh.
#
# pull_request_target is required: Dependabot PRs get a read-only token on
# pull_request, which cannot enable auto-merge. It runs with write permissions
# against the base repo, so this workflow must never check out or execute the
# PR's code — it only reads metadata about the bump.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note majors left for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::Major update ${{ steps.meta.outputs.dependency-names }} left for manual review"
